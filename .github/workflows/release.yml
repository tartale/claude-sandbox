name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get Claude version
        id: claude-version
        run: echo "version=$(npm view @anthropic-ai/claude-code version 2>/dev/null || echo latest)" >> $GITHUB_OUTPUT

      - name: Get release version
        id: release-version
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Build and push base image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/tartale/claude-sandbox:latest
            ghcr.io/tartale/claude-sandbox:${{ steps.release-version.outputs.version }}
          build-args: CLAUDE_VERSION=${{ steps.claude-version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push language variants
        run: |
          for plugin in plugins/languages/*.sh; do
            lang=$(basename "$plugin" .sh)
            echo "Building $lang..."
            docker buildx build --platform linux/amd64,linux/arm64 --push \
              -t ghcr.io/tartale/claude-sandbox:$lang \
              -t ghcr.io/tartale/claude-sandbox:$lang-${{ steps.release-version.outputs.version }} \
              --build-arg PLUGINS=plugins/languages/$lang.sh \
              --build-arg CLAUDE_VERSION=${{ steps.claude-version.outputs.version }} \
              .
          done

      - name: Tag images with version numbers
        run: ./tag-images.sh all
        env:
          CLAUDE_VERSION: ${{ steps.claude-version.outputs.version }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          make_latest: true
