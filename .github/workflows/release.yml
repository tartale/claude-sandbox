name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    # Tag pushes wait for approval in the GitHub UI, so a session with push access cannot
    # publish an image by pushing a tag.
    environment: release
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get Claude version
        id: claude-version
        run: echo "version=$(npm view @anthropic-ai/claude-code version 2>/dev/null || echo latest)" >> $GITHUB_OUTPUT

      - name: Get release version
        id: release-version
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Build and push base image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: container/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/tartale/claude-sandbox:latest
            ghcr.io/tartale/claude-sandbox:${{ steps.release-version.outputs.version }}
          build-args: CLAUDE_VERSION=${{ steps.claude-version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push language variants
        run: |
          for plugin in plugins/languages/*.sh; do
            lang=$(basename "$plugin" .sh)
            echo "Building $lang..."
            docker buildx build --platform linux/amd64,linux/arm64 --push -f container/Dockerfile \
              -t ghcr.io/tartale/claude-sandbox:$lang \
              -t ghcr.io/tartale/claude-sandbox:$lang-${{ steps.release-version.outputs.version }} \
              --build-arg PLUGINS=plugins/languages/$lang.sh \
              --build-arg CLAUDE_VERSION=${{ steps.claude-version.outputs.version }} \
              .
          done

      - name: Tag images with version numbers
        run: ./cs tags all
        env:
          CLAUDE_VERSION: ${{ steps.claude-version.outputs.version }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          generate_release_notes: true
          make_latest: true
