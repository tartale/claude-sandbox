version: 2
updates:
  # The base image digest in container/Dockerfile.
  - package-ecosystem: docker
    directory: /container
    schedule:
      interval: weekly
    # Only digest refreshes of the pinned node:22-slim: moving to another Node release is a
    # decision made by hand.
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]
  # Pinned actions in the workflows.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
